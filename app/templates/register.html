{% extends "base.html" %}
{% block title %}register // movie club{% endblock %}
{% block content %}
<section class="auth-box">
  <h1>register</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <label>handle
      <input type="text" name="name" required autofocus maxlength="80">
    </label>
    <label>email
      <input type="email" name="email" required>
    </label>
    <label>password (8+ chars)
      <input type="password" name="password" required minlength="8">
    </label>
    <button type="submit">sign up</button>
  </form>
  <p class="dim">have an account? <a href="/login">login</a></p>
</section>
{% endblock %}
