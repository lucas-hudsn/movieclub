{% extends "base.html" %}
{% block title %}leaderboard // movie club{% endblock %}
{% block content %}
<h1>all-time leaderboard</h1>
<table>
  <thead><tr><th>rank</th><th>operator</th><th>wins</th></tr></thead>
  <tbody>
  {% for row in rows %}
    <tr class="{% if loop.index == 1 %}top{% endif %}">
      <td>{{ loop.index }}</td><td>{{ row.name }}</td><td>{{ row.wins }}</td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="dim">no months completed yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
