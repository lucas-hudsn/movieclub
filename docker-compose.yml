services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: movieclub
      POSTGRES_PASSWORD: movieclub
      POSTGRES_DB: movieclub
    ports:
      - "5433:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieclub"]
      interval: 2s
      timeout: 3s
      retries: 15
